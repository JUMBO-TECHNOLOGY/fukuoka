<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>福岡由布院秋旅手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: one day per page, sticky day-chip bar on top, illustrated postcard header, vertical timeline, stay card at the end */
:root{
  --paper:#F5F8F3; --card:#FFFFFF; --ink:#2E3A35; --muted:#6F7F78; --line:#DDE7E0;
  --sage:#7DA897; --sage-soft:#E4EFE9; --peach:#EBA98E; --peach-soft:#FBEBE3;
  --accent:#7DA897; --accent-soft:#E4EFE9;
  --shadow:0 1px 2px rgba(46,58,53,.05),0 6px 20px rgba(46,58,53,.06);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Quicksand","Nunito",ui-rounded,system-ui,sans-serif;
  --art-filter:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B18; --card:#1C2521; --ink:#E4ECE7; --muted:#9AABA3; --line:#2C3833;
    --sage:#8FBBA9; --sage-soft:#23312B; --peach:#E9A88E; --peach-soft:#34261F;
    --shadow:0 1px 2px rgba(0,0,0,.3); --art-filter:brightness(.82) saturate(.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141B18; --card:#1C2521; --ink:#E4ECE7; --muted:#9AABA3; --line:#2C3833;
  --sage:#8FBBA9; --sage-soft:#23312B; --peach:#E9A88E; --peach-soft:#34261F;
  --shadow:0 1px 2px rgba(0,0,0,.3); --art-filter:brightness(.82) saturate(.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-family:var(--f-display);font-size:17px}
.brand small{font-family:var(--f-num);font-size:12px;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 13px/1.4 var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:54px}
.chip b{font:700 13px/1.2 var(--f-num)}
.chip span{font-size:11px;color:var(--muted)}
.chip[aria-selected="true"]{background:var(--c,var(--sage));border-color:var(--c,var(--sage));color:#fff}
.chip[aria-selected="true"] span{color:rgba(255,255,255,.85)}
.chip:focus-visible,.btn:focus-visible,.pager button:focus-visible,.dayrow:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

/* pages */
.page{padding-top:16px;animation:fade .28s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

.post{border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.post svg{display:block;width:100%;height:auto;filter:var(--art-filter)}
.post-cap{padding:14px 18px 16px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font:700 12px/1 var(--f-num);letter-spacing:.14em;color:var(--c,var(--sage));text-transform:uppercase}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:26px}
h2{font-size:20px}
.sub{color:var(--muted);font-size:13.5px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:999px;padding:7px 14px;font:500 13.5px/1.2 var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--c,var(--sage));border-color:var(--c,var(--sage));color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px}

/* timeline */
.tl{list-style:none;margin:22px 0 0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:58px 18px minmax(0,1fr);column-gap:10px;padding-bottom:18px;position:relative}
.stop::before{content:"";position:absolute;left:66px;top:18px;bottom:-4px;width:2px;background:repeating-linear-gradient(var(--line) 0 5px,transparent 5px 9px)}
.stop:last-child::before{display:none}
.time{text-align:right;padding-top:9px;font:700 15px/1.2 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.time .end{display:block;margin-top:3px;font:500 12px/1.2 var(--f-num);color:var(--muted)}
.time.soft{font:500 12.5px/1.3 var(--f-body);color:var(--muted);padding-top:11px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--c,var(--sage));margin-top:12px;justify-self:center;position:relative;z-index:1}
.stop.fixed .dot{background:var(--c,var(--sage))}
.box{background:var(--card);border-radius:14px;padding:10px 14px 12px;box-shadow:var(--shadow);min-width:0}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.kind svg{width:14px;height:14px}
.box h3{margin:2px 0 0;font:500 16px/1.45 var(--f-body);text-wrap:pretty}
.box p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.box .actions{margin-top:8px;gap:6px}
.flights{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.flight{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:7px 10px;font-size:13.5px}
.flight b{font:700 15px/1 var(--f-num);font-variant-numeric:tabular-nums}
.flight .tag{font-size:11.5px;color:var(--muted);margin-left:auto}

.stay{margin-top:6px;border:1.5px dashed var(--c,var(--sage));border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--accent-soft)}
.stay .kind{color:var(--ink)}
.stay h3{margin:0;font:700 17px/1.4 var(--f-display)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;font:500 13.5px/1.35 var(--f-body);cursor:pointer;text-align:left;min-width:0}
.pager button.next{text-align:right}
.pager button small{display:block;color:var(--muted);font-size:11.5px}
.pager button[hidden]{display:none}
.pager .spacer{flex:1}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

/* overview */
.section-t{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font:700 17px/1.3 var(--f-display)}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}
.days{display:flex;flex-direction:column;gap:8px}
.dayrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);border:0;color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%}
.dayrow .d{border-radius:10px;background:var(--c);color:#fff;text-align:center;padding:4px 0;font:700 15px/1.2 var(--f-num)}
.dayrow .d small{display:block;font:500 11px/1.2 var(--f-body);opacity:.9}
.dayrow strong{font:700 15.5px/1.35 var(--f-display);display:block}
.dayrow span.s{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .arr{color:var(--muted)}
.info{background:var(--card);border-radius:14px;padding:4px 14px;box-shadow:var(--shadow)}
.info-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.info-row:last-child{border-bottom:0}
.info-row .l{font:700 13px/1.3 var(--f-num);color:var(--muted);min-width:78px;font-variant-numeric:tabular-nums}
.info-row .m{flex:1;min-width:0;font-size:14px}
.info-row .m small{display:block;color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:0 18px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>

/* ---------- rendering ---------- */
const main = document.getElementById("main"), chips = document.getElementById("chips");
const PAGES = [{id:"overview", label:"總覽"}].concat(DAYS);
let cur = 0;

chips.innerHTML = PAGES.map((p,i)=> i===0
  ? `<button class="chip" role="tab" data-i="0" id="tab-0" style="--c:#7DA897"><b>總覽</b><span>行程</span></button>`
  : `<button class="chip" role="tab" data-i="${i}" id="tab-${i}" style="--c:${p.c}"><b>${p.date}</b><span>Day ${i}</span></button>`).join("");
chips.addEventListener("click", e=>{const b=e.target.closest(".chip"); if(b) go(+b.dataset.i);});

function stayCard(s){
  if(!s) return "";
  const links = s.map
    ? `<a class="btn sm primary" href="${s.map}" target="_blank" rel="noopener">${ic("map")}地圖</a>${s.airbnb?`<a class="btn sm" href="${s.airbnb}" target="_blank" rel="noopener">${ic("home")}Airbnb 頁面</a>`:""}`
    : `<a class="btn sm primary" href="${G(s.q)}" target="_blank" rel="noopener">${ic("map")}地圖</a>`;
  return `<div class="stay"><span class="kind">${ic("bed")}今晚住宿</span><h3>${s.zh||s.name}</h3>${s.en?`<p class="sub" style="margin:0">${s.en}</p>`:""}<div class="actions" style="margin-top:6px">${links}</div></div>`;
}

function stopHTML(s){
  const href = s.map || ((s.q||s.nav) && G(s.q||s.nav));
  const links = s.qs
    ? s.qs.map(([l,q])=>`<a class="btn sm primary" href="${G(q)}" target="_blank" rel="noopener">${ic("map")}${l}</a>`).join("")
    : href ? `<a class="btn sm primary" href="${href}" target="_blank" rel="noopener">${ic("map")}地圖</a>` : "";
  const fl = s.flights ? `<div class="flights">${s.flights.map(f=>`<div class="flight"><b>${f[0]}</b><span>${f[1]}</span><b>${f[2]}</b>${f[3]?`<span class="tag">${f[3]}</span>`:""}</div>`).join("")}</div>` : "";
  return `<li class="stop${s.fixed?" fixed":""}">
    <div class="time${s.fixed?"":" soft"}">${s.t}${s.te?`<small class="end">～${s.te}</small>`:""}</div><span class="dot"></span>
    <div class="box"><span class="kind">${ic(s.k)}${KIND[s.k]}</span><h3>${s.h}</h3>${s.p?`<p>${s.p}</p>`:""}${fl}${links?`<div class="actions">${links}</div>`:""}</div>
  </li>`;
}

function routeURL(d){
  const pts = d.stops.flatMap(s=>s.qs ? s.qs.map(x=>x[1]) : [s.q||s.nav]).filter(Boolean);
  const uniq = pts.filter((p,i)=>p!==pts[i-1]);
  return "https://www.google.com/maps/dir/" + uniq.map(encodeURIComponent).join("/");
}

function pager(i){
  const prev = PAGES[i-1], next = PAGES[i+1];
  const lab = p => p.id==="overview" ? "總覽" : `${p.date}（${p.wd}）${p.title}`;
  return `<div class="pager">
    ${prev?`<button class="prev" data-go="${i-1}"><small>← 上一頁</small>${lab(prev)}</button>`:`<span class="spacer"></span>`}
    ${next?`<button class="next" data-go="${i+1}"><small>下一頁 →</small>${lab(next)}</button>`:`<span class="spacer"></span>`}
  </div><p class="hint">左右滑動也可以換頁</p>`;
}

function dayPage(i){
  const d = PAGES[i];
  return `<section class="page" style="--c:${d.c};--accent-soft:color-mix(in srgb,${d.c} 14%,var(--card))" aria-labelledby="h-${d.id}">
    <div class="post">${ART["d"+i]}
      <div class="post-cap"><span class="eyebrow">Day ${i} · ${d.date}（${d.wd}）</span><h1 id="h-${d.id}">${d.title}</h1><span class="sub">${d.sub}</span></div>
    </div>
    <div class="actions"><a class="btn primary" href="${routeURL(d)}" target="_blank" rel="noopener">${ic("route")}在 Google 地圖看今日路線</a></div>
    <ol class="tl">${d.stops.map(stopHTML).join("")}</ol>
    ${stayCard(d.stay)}
    ${pager(i)}
  </section>`;
}

      <div class="info-row"><span class="l">10/15–10/16</span><span class="m">${HOTEL_A.name}<small>博多・2 晚</small></span><a class="btn sm" href="${G(HOTEL_A.q)}" target="_blank" rel="noopener">${ic("map")}地圖</a></div>
      <div class="info-row"><span class="l">10/17</span><span class="m">${HOTEL_B.zh}<small>由布院・1 晚・Airbnb</small></span><a class="btn sm" href="${HOTEL_B.map}" target="_blank" rel="noopener">${ic("map")}地圖</a></div>
      <div class="info-row"><span class="l">10/18–10/19</span><span class="m">${HOTEL_C.name}<small>${HOTEL_C.en}・2 晚</small></span><a class="btn sm" href="${G(HOTEL_C.q)}" target="_blank" rel="noopener">${ic("map")}地圖</a></div>
    </div>
    ${pager(0)}
  </section>`;
}

function render(){
  main.innerHTML = cur===0 ? overviewPage() : dayPage(cur);
  chips.querySelectorAll(".chip").forEach(b=>{
    const on = +b.dataset.i===cur; b.setAttribute("aria-selected", on);
    if(on) b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  });
}
function go(i, push=true){
  if(i<0||i>=PAGES.length) return;
  cur = i; render(); window.scrollTo({top:0});
  if(push) try{ history.replaceState(null,"","#"+PAGES[i].id); }catch(e){}
}
main.addEventListener("click", e=>{const b=e.target.closest("[data-go]"); if(b) go(+b.dataset.go);});

/* swipe between days */
let sx=0, sy=0, st=0;
main.addEventListener("touchstart", e=>{const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();}, {passive:true});
main.addEventListener("touchend", e=>{
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Date.now()-st<700 && Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8) go(cur + (dx<0?1:-1));
}, {passive:true});
document.addEventListener("keydown", e=>{ if(e.key==="ArrowRight") go(cur+1); if(e.key==="ArrowLeft") go(cur-1); });

/* start: #day3 link → that day; during the trip → today (Japan time); otherwise overview */
(function start(){
  const h = (location.hash||"").slice(1);
  let i = PAGES.findIndex(p=>p.id===h);
  if(i<0){
    let today=""; try{ today = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"}); }catch(e){}
    i = Math.max(0, DAYS.findIndex(d=>d.iso===today)+1);
  }
  go(i, false);
})();
</script>

</body>
</html>
